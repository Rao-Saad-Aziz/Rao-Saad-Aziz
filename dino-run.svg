<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="850" height="200">
<style>
.bg{fill:#0f0c29}
.dino{fill:#24c6dc} .eye{fill:#0f0c29}
.cac{fill:#8b7cf6} .cloud{fill:#302b63} .gnd{stroke:#24c6dc;stroke-width:2}
