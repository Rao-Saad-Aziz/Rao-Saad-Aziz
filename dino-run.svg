 0%,27%{transform:translateY(0)} 33%,40%{transform:translateY(-85px)} 46%,77%{transform:translateY(0)}
 83%,90%{transform:translateY(-85px)} 96%,100%{transform:translateY(0)} }
.legA{animation:legA .24s steps(1) infinite} .legB{animation:legB .24s steps(1) infinite}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
.c1{animation:move 4s linear infinite} .c2{animation:move 4s linear infinite;animation-delay:-2s}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(-900px)}}
.ground{animation:gmove 1s linear infinite}
@keyframes gmove{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.cl1{animation:move 16s linear infinite} .cl2{animation:move 16s linear infinite;animation-delay:-8s}
.blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
</style>
